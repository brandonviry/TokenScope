[package]
name = "tokenscope"
version = "1.1.0"
edition = "2024"
rust-version = "1.88"
description = "Tableau de bord natif des quotas, crédits et tokens IA"
license = "MIT"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
directories = "6"
walkdir = "2"
memchr = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
csv = "1"
rfd = "0.15"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
opt-level = 2
lto = "thin"
strip = true

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

